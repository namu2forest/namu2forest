<body class="bg-background text-on-surface font-body-md overflow-x-hidden pt-16 pb-24 md:pb-0 relative flex flex-col min-h-screen">
    <!-- Header -->
    <header class="bg-white/95 backdrop-blur-xl fixed top-0 w-full z-50 border-b border-[#E8EFEA] shadow-sm transition-all duration-300">
        <div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-container-max mx-auto">
            <a href="index.html" class="flex items-center gap-2 text-primary">
                <span class="material-symbols-outlined font-headline-sm">house</span>

            </a>
            <nav class="hidden md:flex gap-6 text-sm font-medium">
                <a href="index.html" class="text-on-surface-variant hover:text-primary transition-colors">홈</a>
                <a href="news.html" class="text-primary font-bold">소식 & 공지</a>
                <a href="admin.html" class="text-on-surface-variant hover:text-primary transition-colors">관리자</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-container-max mx-auto w-full px-margin-mobile flex flex-col gap-8 pt-8 pb-12">
        <section class="py-8 border-b border-[#E8EFEA]">
            <h1 class="text-3xl font-bold mb-2 text-primary">소식 & 부동산 소식</h1>
            <p class="text-on-surface-variant">동탄 나무 부동산에서 전해드리는 공지사항 및 최근 매물/투자 뉴스입니다.</p>
        </section>

        <!-- Search & Filter Controls -->
        <section class="flex flex-col sm:flex-row gap-4 justify-between items-center">
            <div class="flex gap-2">
                <button onclick="filterCategory('전체')" class="category-btn active px-4 py-2 rounded-full border border-primary bg-primary text-white font-medium text-sm transition-all shadow-sm" data-category="전체">전체</button>
                <button onclick="filterCategory('공지사항')" class="category-btn px-4 py-2 rounded-full border border-[#E8EFEA] bg-white text-on-surface hover:bg-[#E8EFEA] font-medium text-sm transition-all shadow-sm" data-category="공지사항">공지사항</button>
                <button onclick="filterCategory('매물정보')" class="category-btn px-4 py-2 rounded-full border border-[#E8EFEA] bg-white text-on-surface hover:bg-[#E8EFEA] font-medium text-sm transition-all shadow-sm" data-category="매물정보">매물정보</button>
            </div>
            <div class="w-full sm:w-72 relative">
                <span class="material-symbols-outlined absolute left-3 top-2.5 text-on-surface-variant text-sm">search</span>
                <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="검색어를 입력하세요..." class="w-full pl-9 pr-4 py-2 bg-white border border-[#E8EFEA] rounded-lg text-sm text-on-surface focus:outline-none focus:border-primary shadow-sm">
            </div>
        </section>

        <!-- Post List Container -->
        <section id="postList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Dynamic Post Cards will render here -->
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-[#E8EFEA] py-12 px-margin-mobile md:px-margin-desktop pb-32 md:pb-12">

            <p class="text-xs text-on-surface-variant">© 2026 Namu Real Estate. All rights reserved.</p>
        </div>
    </footer>

    <nav class="md:hidden bg-white/95 backdrop-blur-xl fixed bottom-0 w-full z-50 rounded-t-2xl border-t border-[#E8EFEA] shadow-[0_-4px_20px_rgba(0,0,0,0.06)] px-margin-mobile py-3 flex justify-around items-center">

            <span class="font-label-sm text-xs">홈</span>
        </a>

            <span class="font-label-sm text-xs">소식 & 공지</span>
        </a>
        <a class="flex flex-col items-center justify-center bg-[#C29046] text-white font-bold rounded-full px-5 py-2 active:scale-95 transition-transform shadow-md hover:bg-[#b0813c]" href="tel:010-5635-2684">
            <span class="material-symbols-outlined text-xl mb-0.5">call</span>
            <span class="font-label-sm text-xs">전화 연결</span>
        </a>
    </nav>

    <script src="db.js"></script>
    <script>
        let currentCategory = '전체';

        function renderPosts() {
            const posts = window.postDB.getPosts();
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('postList');

            const filtered = posts.filter(post => {
                const matchCat = (currentCategory === '전체') || (post.category === currentCategory);
                const matchSearch = post.title.toLowerCase().includes(searchVal) || (post.summary && post.summary.toLowerCase().includes(searchVal));
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-on-surface-variant">등록된 게시글이 없습니다.</div>`;
                return;
            }

            container.innerHTML = filtered.map(post => `
                <a href="news-detail.html?id=${post.id}" class="bg-white p-6 rounded-xl border border-[#E8EFEA] shadow-sm flex flex-col gap-3 hover:border-primary/40 hover:shadow-md transition-all">
                    <div class="flex justify-between items-center">
                        <span class="px-3 py-1 rounded-full bg-[#E8EFEA] text-primary text-xs font-semibold">${post.category || '일반'}</span>
                        <span class="text-xs text-[#6B7770]">${post.createdAt}</span>
                    </div>
                    <h2 class="text-xl font-bold text-primary hover:underline transition-colors">${post.title}</h2>
                    <p class="text-sm text-on-surface line-clamp-2">${post.summary || post.content.substring(0, 100)}</p>
                    <div class="flex items-center gap-1 text-primary text-xs font-medium mt-2">
                        자세히 보기 <span class="material-symbols-outlined text-xs">arrow_forward</span>
                    </div>
                </a>
            `).join('');
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.dataset.category === cat) {
                    btn.classList.remove('bg-white', 'text-on-surface', 'border-[#E8EFEA]');
                    btn.classList.add('bg-primary', 'text-white', 'border-primary');
                } else {
                    btn.classList.remove('bg-primary', 'text-white', 'border-primary');
                    btn.classList.add('bg-white', 'text-on-surface', 'border-[#E8EFEA]');
                }
            });
            renderPosts();
        }

        function handleSearch() {
            renderPosts();
        }

        document.addEventListener('DOMContentLoaded', renderPosts);
    </script>
